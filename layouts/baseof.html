<!doctype html>
<html lang="{{ .Site.Language.Lang | default "zh-cn" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}欢迎来到{{ .Site.Title }}喵～ ヾ(≧▽≦*)o{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <link rel="icon" type="image/png" href="{{ "images/OIP.png" | relURL }}">
    <link rel="stylesheet" href="{{ "css/argon.css" | relURL }}?v=20260729-5">
    {{ with .OutputFormats.Get "RSS" }}<link rel="alternate" type="application/rss+xml" href="{{ .RelPermalink }}" title="{{ $.Site.Title }}">{{ end }}
  </head>
  <body class="page-kind-{{ .Kind }}">
    <div class="reading-progress" id="reading-progress" aria-hidden="true"></div>
    {{ partial "argon-nav.html" . }}
    <main>{{ block "main" . }}{{ end }}</main>
    {{ partial "argon-footer.html" . }}
    <button class="back-to-top" id="back-to-top" type="button" aria-label="返回顶部" title="返回顶部">↑</button>
    <script src="{{ "js/argon.js" | relURL }}?v=20260729-3" defer></script>
  </body>
</html>
