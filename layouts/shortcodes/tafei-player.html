<div class="tafei-player" data-tafei-player>
  <button class="tafei-player-button" data-tafei-toggle type="button" aria-pressed="false" aria-label="播放关注塔菲谢谢喵" title="播放关注塔菲谢谢喵">
    <span class="tafei-player-icon" data-tafei-icon aria-hidden="true">▶</span>
    <span data-tafei-label>播放</span>
  </button>
  <audio data-tafei-audio preload="metadata">
    <source src="{{ "audio/tafei.mp3" | relURL }}" type="audio/mpeg">
  </audio>
</div>
