<header class="site-nav" id="site-nav">
  <div class="nav-inner">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}" aria-label="{{ .Site.Title }}首页">
      <img src="{{ .Site.Params.avatar | relURL }}" alt="" width="38" height="38">
      <span>{{ .Site.Title }}</span>
    </a>
    <button class="nav-toggle" id="nav-toggle" type="button" aria-label="打开导航" aria-expanded="false">&#9776;</button>
    <nav class="nav-links" id="nav-links" aria-label="主导航">
      <a href="https://www.xingyexiaohua.xyz/">主站</a>
      <a href="{{ .Site.Home.RelPermalink }}">首页</a>
      <a href="{{ "posts/" | relURL }}">文章</a>
      <a href="{{ "categories/" | relURL }}">分类</a>
      <a href="{{ "tags/" | relURL }}">标签</a>
      <a href="{{ "quotes/" | relURL }}">语录</a>
      <a class="changelog-link" href="{{ "changelog/" | relURL }}">更新日志</a>
      <button class="random-toggle" id="random-toggle" type="button" data-index-url="{{ "index.json" | relURL }}" aria-label="随机阅读一篇文章" title="随机漫游">&#x2684;</button>
      <button class="music-toggle" id="music-toggle" type="button" aria-label="打开音乐播放器" title="星野电台" aria-expanded="false">&#9835;</button>
      <button class="search-toggle" id="search-toggle" type="button" aria-label="搜索文章" title="搜索文章"><span class="search-icon" aria-hidden="true"></span></button>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换颜色模式" title="切换颜色模式">&#9680;</button>
    </nav>
  </div>
</header>
<div class="search-dialog" id="search-dialog" role="dialog" aria-modal="true" aria-labelledby="search-title" data-index-url="{{ "index.json" | relURL }}" hidden>
  <button class="search-backdrop" type="button" data-search-close aria-label="关闭搜索"></button>
  <section class="search-panel" aria-describedby="search-status">
    <header class="search-header">
      <div>
        <span>SEARCH</span>
        <h2 id="search-title">搜索文章</h2>
      </div>
      <button class="search-close" type="button" data-search-close aria-label="关闭搜索" title="关闭搜索">&times;</button>
    </header>
    <label class="search-field">
      <span class="search-icon" aria-hidden="true"></span>
      <input id="search-input" type="search" inputmode="search" autocomplete="off" placeholder="输入标题、标签或文章内容" aria-controls="search-results">
    </label>
    <p class="search-status" id="search-status" aria-live="polite">输入关键词开始搜索</p>
    <div class="search-results" id="search-results"></div>
  </section>
</div>
<aside class="music-panel" id="music-panel" data-player-url="https://music.163.com/outchain/player?type=0&amp;id=17374688975&amp;auto=0&amp;height=90" aria-label="星野电台" hidden>
  <header class="music-panel-header">
    <div><span>STARFIELD RADIO</span><h2>星野电台</h2></div>
    <div class="music-actions" aria-label="音乐播放器操作">
      <button class="music-stop" id="music-stop" type="button" aria-label="停止音乐并关闭播放器" title="停止音乐并关闭播放器">&#9632;</button>
      <button class="music-close" id="music-close" type="button" aria-label="收起播放器，音乐继续播放" title="收起播放器，音乐继续播放">&#8722;</button>
    </div>
  </header>
  <div class="music-frame-slot" id="music-frame-slot"></div>
</aside>
